    .fab-telegram {

    @keyframes fab-bounce {
      0%, 100% { transform: translateY(0); }

    // ─── Estado global ───────────────────────────────────────────────────────

      const btn = esCerrado

            ${c.descripcion}
          </h3>
          ${btn}
        </div>`;
    }

    // ─── Card tipo A: header coloreado ───────────────────────────────────────
    function cardColor(c) {
      return `
        <div style="background-color:${c.color}; min-height:210px;"
             class="p-5 flex flex-col justify-between rounded-t-xl">
          <div>
            <div class="inline-flex items-center bg-white text-slate-900 font-extrabold badge-pill px-2.5 py-[5px] rounded mb-4 uppercase tracking-widest whitespace-nowrap">
              CURSO ${c.id}&nbsp;&middot;&nbsp;${c.anio}
            </div>
            <h2 class="card-title-big text-white uppercase tracking-tight mb-1">${c.nombreCorto}</h2>
            <p class="text-[0.68rem] font-semibold text-white/60 uppercase tracking-widest leading-tight">${c.subtitulo}</p>
          </div>
          <div class="mt-5">
            <span class="inline-block bg-white/90 text-slate-800 font-extrabold badge-pill px-3 py-[5px] rounded uppercase">${c.duracion}</span>
          </div>
        </div>
        ${footerHTML(c)}`;
    }

    // ─── Card tipo B: header con imagen ──────────────────────────────────────
    function cardImagen(c) {
      const esCerrado = c.estado === 'CERRADO';
      return `
        <div class="rounded-t-xl overflow-hidden bg-slate-100" style="height:200px;">
          <img src="${c.imagen}" alt="${c.descripcion}"
               class="w-full h-full object-cover ${esCerrado ? 'grayscale opacity-60' : ''}"
               loading="lazy"
               onerror="this.style.display='none'; this.parentElement.classList.add('bg-brand-navy');" />
        </div>
        ${footerHTML(c)}`;
    }

    // ─── Render ──────────────────────────────────────────────────────────────
    function renderCursos(cursos) {
      const grid = document.getElementById('cursos-grid');
      const empty = document.getElementById('empty-state');
      const counter = document.getElementById('counter');

      grid.innerHTML = '';

      if (cursos.length === 0) {
        grid.classList.add('hidden');
        empty.classList.remove('hidden');
        counter.textContent = '';
        return;
      }

      grid.classList.remove('hidden');
      empty.classList.add('hidden');

      const abiertos = cursos.filter(c => c.estado === 'ABIERTO').length;
      const cerrados = cursos.filter(c => c.estado === 'CERRADO').length;
      counter.textContent = filtroActual === 'TODOS'
        ? `${abiertos} abiertos · ${cerrados} cerrados`
        : `${cursos.length} curso${cursos.length !== 1 ? 's' : ''}`;

      cursos.forEach((c, i) => {
        const card = document.createElement('div');
        card.className = [
          'card-enter flex flex-col rounded-xl overflow-hidden shadow-sm hover:shadow-lg transition-shadow duration-300',
          c.estado === 'CERRADO' ? 'opacity-75' : '',
        ].join(' ');
        card.style.animationDelay = `${i * 60}ms`;
        card.innerHTML = c.tipo === 'color' ? cardColor(c) : cardImagen(c);
        grid.appendChild(card);
      });
    }

    // ─── Filtro ──────────────────────────────────────────────────────────────
    function filtrar(estado) {
      filtroActual = estado;

      // Actualizar botones
      document.querySelectorAll('.filtro-btn').forEach(btn => {
        const isActive = btn.dataset.filtro === estado;
        btn.classList.toggle('bg-brand-dark', isActive);
        btn.classList.toggle('text-white', isActive);
        btn.classList.toggle('bg-white', !isActive);
        btn.classList.toggle('text-slate-500', !isActive);
        btn.classList.toggle('border-slate-200', !isActive);
        btn.classList.toggle('border', !isActive);
      });

      const filtered = estado === 'TODOS'
        ? CURSOS
        : CURSOS.filter(c => c.estado === estado);

      renderCursos(filtered);
    }

    // ─── Scroll-to-top visibility ────────────────────────────────────────────
    const scrollBtn = document.getElementById('scroll-top');
    window.addEventListener('scroll', () => {
      scrollBtn.classList.toggle('visible', window.scrollY > 300);
    }, { passive: true });

    // ─── Init ────────────────────────────────────────────────────────────────
    renderCursos(CURSOS);
  </script>
