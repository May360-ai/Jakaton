    // ── Footer blanco compartido por ambos tipos ───────────────────────────────

      const esCerrado = c.estado === 'CERRADO';
      const btnInscripcion = esCerrado
        ? `<button disabled class="mt-3 px-4 py-2 bg-slate-200 text-slate-400 font-bold text-xs uppercase tracking-widest rounded cursor-not-allowed">
             Inscripciones cerradas
           </button>`
        : `<a href="${c.enlace}" target="_blank" rel="noopener noreferrer"
             class="mt-3 inline-block px-5 py-2 bg-[#a61019] hover:bg-[#881318] text-white font-extrabold text-xs uppercase tracking-widest rounded transition-colors">
             INSCRIBIRME
           </a>`;

      return `
        <div class="bg-white px-5 pt-4 pb-5 flex flex-col gap-2 border border-slate-100 border-t-0 rounded-b-xl flex-1">
          <!-- Estado + horas -->
          <div class="flex items-center gap-5 text-[0.67rem] font-bold uppercase tracking-widest text-rose-700">
            <div class="flex items-center gap-1.5">
              ${SVG_PERSONAS}
              <span>${c.estado}</span>
            </div>
            <div class="flex items-center gap-1.5">
              ${SVG_RELOJ}
              <span>${c.duracion}</span>
            </div>
          </div>
          <!-- Descripción -->
          <h3 class="text-[0.78rem] font-extrabold text-[#1a2333] uppercase tracking-tight leading-snug">
            ${c.descripcion}
          </h3>
          <!-- Botón -->
          ${btnInscripcion}
        </div>`;
    }

    // ── Card tipo A: header coloreado ─────────────────────────────────────────
    function cardColor(c) {
      return `
        <!-- Header coloreado -->
        <div style="background-color:${c.color}; min-height:210px;"
             class="p-5 flex flex-col justify-between rounded-t-xl">
          <div>
            <!-- Badge CURSO XX · AÑO -->
            <div class="inline-flex items-center bg-white text-slate-900 font-extrabold badge-pill px-2.5 py-[5px] rounded mb-4 uppercase tracking-widest whitespace-nowrap">
              CURSO ${c.id}&nbsp;&middot;&nbsp;${c.anio}
            </div>
            <!-- Nombre corto grande -->
            <h2 class="card-title-big text-white uppercase tracking-tight mb-1">
              ${c.nombreCorto}
            </h2>
            <!-- Subtítulo -->
            <p class="text-[0.68rem] font-semibold text-white/60 uppercase tracking-widest leading-tight">
              ${c.subtitulo}
            </p>
          </div>
          <!-- Horas badge -->
          <div class="mt-5">
            <span class="inline-block bg-white/90 text-slate-800 font-extrabold badge-pill px-3 py-[5px] rounded uppercase">
              ${c.duracion}
            </span>
          </div>
        </div>
        ${footerHTML(c)}`;
    }

    // ── Card tipo B: header con imagen ────────────────────────────────────────
    function cardImagen(c) {
      const esCerrado = c.estado === 'CERRADO';
      return `
        <!-- Header imagen -->
        <div class="rounded-t-xl overflow-hidden" style="height:200px;">
          <img src="${c.imagen}"
               alt="${c.descripcion}"
               class="w-full h-full object-cover ${esCerrado ? 'grayscale opacity-70' : ''}"
               loading="lazy"
               onerror="this.style.display='none'; this.parentElement.style.background='#1a2e44';" />
        </div>
        ${footerHTML(c)}`;
    }

    // ── Render principal ──────────────────────────────────────────────────────
    function renderCursos(cursos) {
      const grid = document.getElementById('cursos-grid');
      grid.innerHTML = '';

      cursos.forEach((c) => {
        const esCerrado = c.estado === 'CERRADO';
        const card = document.createElement('div');
        card.className = [
          'flex flex-col rounded-xl overflow-hidden shadow-sm hover:shadow-lg transition-shadow duration-300',
          esCerrado ? 'opacity-80' : ''
        ].join(' ');

        card.innerHTML = c.tipo === 'color' ? cardColor(c) : cardImagen(c);
        grid.appendChild(card);
      });
    }

    renderCursos(CURSOS);
