<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cursos Disponibles - FISEI</title>
  <!-- Google Fonts: Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #fcfcfd;
    }
    .badge-pill {
      font-size: 0.68rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen py-12 px-4 sm:px-6 lg:px-8">

  <!-- Encabezado de la página -->
  <header class="text-center mb-10">
    <span class="text-red-700 tracking-[0.3em] font-bold text-sm uppercase block mb-2">
      C U R S O S
    </span>
    <h1 class="text-3xl sm:text-4xl font-extrabold text-[#232f48] tracking-tight">
      Cursos Disponibles
    </h1>
  </header>

  <!-- Filtros por estado -->
  <div class="max-w-7xl mx-auto flex gap-3 mb-8 flex-wrap">
    <button onclick="filtrar('TODOS')" id="btn-TODOS"
      class="filtro-btn bg-[#232f48] text-white px-5 py-2 rounded-full font-bold text-xs tracking-wider uppercase transition-all">
      Todos
    </button>
    <button onclick="filtrar('ABIERTO')" id="btn-ABIERTO"
      class="filtro-btn bg-white border border-slate-300 text-slate-600 px-5 py-2 rounded-full font-bold text-xs tracking-wider uppercase hover:border-green-600 hover:text-green-700 transition-all">
      Abiertos
    </button>
    <button onclick="filtrar('CERRADO')" id="btn-CERRADO"
      class="filtro-btn bg-white border border-slate-300 text-slate-600 px-5 py-2 rounded-full font-bold text-xs tracking-wider uppercase hover:border-slate-500 hover:text-slate-700 transition-all">
      Cerrados
    </button>
  </div>

  <!-- Contenedor de la Grilla de Cursos -->
  <main class="max-w-7xl mx-auto">
    <div id="cursos-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- Los cursos se inyectan dinámicamente aquí -->
    </div>
  </main>

  <!-- Botón flotante para subir (Scroll to Top) -->
  <a href="#" class="fixed bottom-6 right-6 bg-[#93151b] hover:bg-[#781015] text-white p-3 rounded-lg shadow-lg transition-transform hover:scale-105 flex items-center justify-center">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 11l7-7 7 7M5 19l7-7 7 7" />
    </svg>
  </a>

  <script>
    // ─────────────────────────────────────────────────────────────
    // Datos extraídos por el scraper (cursos_uta.json)
    // Para actualizar: correr scrapeData.py y luego regenerar el HTML,
    // o servir desde un servidor HTTP local para que fetch() funcione.
    // ─────────────────────────────────────────────────────────────
    const CURSOS_RAW = [
      {"id":1,"titulo":"INTRODUCCIÓN A LAS REDES – PREPARACIÓN CCNA","estado":"ABIERTO","duracion":"70 HORAS","enlace":"https://ctt-talleresfisei.uta.edu.ec/curso16.php"},
      {"id":2,"titulo":"PREPARACIÓN LINUX ESSENTIALS CERTIFICATE","estado":"ABIERTO","duracion":"70 HORAS","enlace":"https://ctt-talleresfisei.uta.edu.ec/curso17.php"},
      {"id":3,"titulo":"FUNDAMENTOS DE PYTHON 1","estado":"ABIERTO","duracion":"32 HORAS","enlace":"https://ctt-talleresfisei.uta.edu.ec/curso18.php"},
      {"id":4,"titulo":"GITHUB CERTIFIED: AGENTIC AI DEVELOPER (GH-600)","estado":"ABIERTO","duracion":"32 HORAS","enlace":"https://ctt-talleresfisei.uta.edu.ec/curso19.php"},
      {"id":5,"titulo":"PREPARACIÓN ARDUINO CERTIFICATION PROGRAM","estado":"ABIERTO","duracion":"32 HORAS","enlace":"https://ctt-talleresfisei.uta.edu.ec/curso20.php"},
      {"id":6,"titulo":"FUNDAMENTOS DE PYTHON 2","estado":"ABIERTO","duracion":"40 HORAS","enlace":"https://ctt-talleresfisei.uta.edu.ec/curso21.php"},
      {"id":7,"titulo":"ARDUINO DESDE CERO: ELECTRÓNICA, PROGRAMACIÓN Y AUTOMATIZACIÓN","estado":"ABIERTO","duracion":"40 HORAS","enlace":"https://ctt-talleresfisei.uta.edu.ec/curso13.php"},
      {"id":8,"titulo":"INTELIGENCIA ARTIFICIAL PARA LA GESTIÓN DE RECURSOS HUMANOS","estado":"ABIERTO","duracion":"32 HORAS","enlace":"https://ctt-talleresfisei.uta.edu.ec/curso15.php"},
      {"id":9,"titulo":"LA LEY DE PROTECCIÓN DE DATOS EN EL ECUADOR","estado":"ABIERTO","duracion":"32 HORAS","enlace":"https://ctt-talleresfisei.uta.edu.ec/curso14.php"},
      {"id":10,"titulo":"ADMINISTRACIÓN Y DEFENSA DE AMENAZAS CIBERNÉTICAS","estado":"ABIERTO","duracion":"50 HORAS","enlace":"https://ctt-talleresfisei.uta.edu.ec/curso9.php"},
      {"id":11,"titulo":"FUNDAMENTOS DE PYTHON 1","estado":"CERRADO","duracion":"32 HORAS","enlace":"https://ctt-talleresfisei.uta.edu.ec/curso1.php"},
      {"id":12,"titulo":"Fundamentos de Python 2","estado":"CERRADO","duracion":"40 HORAS","enlace":"https://ctt-talleresfisei.uta.edu.ec/curso2.php"},
      {"id":13,"titulo":"JavaScript Essentials 1","estado":"CERRADO","duracion":"40 HORAS","enlace":"https://ctt-talleresfisei.uta.edu.ec/curso3.php"},
      {"id":14,"titulo":"JavaScript Essentials 2","estado":"CERRADO","duracion":"50 HORAS","enlace":"https://ctt-talleresfisei.uta.edu.ec/curso4.php"},
      {"id":15,"titulo":"FUNDAMENTOS DE CIENCIA Y ANALÍTICA DE DATOS","estado":"CERRADO","duracion":"32 HORAS","enlace":"https://ctt-talleresfisei.uta.edu.ec/curso5.php"},
      {"id":16,"titulo":"ETHICAL HACKER","estado":"CERRADO","duracion":"70 HORAS","enlace":"https://ctt-talleresfisei.uta.edu.ec/curso6.php"},
      {"id":17,"titulo":"CONCEPTOS BÁSICOS DE REDES","estado":"CERRADO","duracion":"32 HORAS","enlace":"https://ctt-talleresfisei.uta.edu.ec/curso7.php"},
      {"id":18,"titulo":"CIBERSEGURIDAD EN DISPOSITIVOS FINALES","estado":"CERRADO","duracion":"40 HORAS","enlace":"https://ctt-talleresfisei.uta.edu.ec/curso8.php"}
    ];

    // Paleta de colores por índice (alterna azul/rojo para ABIERTO, gris para CERRADO)
    const COLORES_ABIERTO = ['bg-[#032e54]', 'bg-[#032e54]', 'bg-[#a61019]', 'bg-[#032e54]', 'bg-[#032e54]', 'bg-[#a61019]'];
    const COLOR_CERRADO = 'bg-slate-500';

    function adaptarCurso(d, globalIndex) {
      const esCerrado = d.estado === 'CERRADO';
      // Separar título en nombre principal y subtítulo usando " – " o " - "
      const partes = d.titulo.split(/\s[–-]\s/);
      return {
        id: String(d.id).padStart(2, '0'),
        anio: '2026',
        titulo: partes[0] || d.titulo,
        subtitulo: partes[1] || '',
        descripcion: d.titulo,
        duracion: d.duracion,
        estado: d.estado,
        enlace: d.enlace,
        color: esCerrado ? COLOR_CERRADO : (COLORES_ABIERTO[globalIndex % COLORES_ABIERTO.length])
      };
    }

    let cursosFiltrados = CURSOS_RAW;

    function filtrar(estado) {
      // Actualizar botones activos
      document.querySelectorAll('.filtro-btn').forEach(b => {
        b.classList.remove('bg-[#232f48]', 'text-white', 'bg-green-700', 'border-green-700');
        b.classList.add('bg-white', 'border-slate-300', 'text-slate-600');
      });
      const btn = document.getElementById('btn-' + estado);
      btn.classList.remove('bg-white', 'border-slate-300', 'text-slate-600');
      if (estado === 'ABIERTO') {
        btn.classList.add('bg-green-700', 'text-white');
      } else if (estado === 'CERRADO') {
        btn.classList.add('bg-slate-600', 'text-white');
      } else {
        btn.classList.add('bg-[#232f48]', 'text-white');
      }

      cursosFiltrados = estado === 'TODOS' ? CURSOS_RAW : CURSOS_RAW.filter(c => c.estado === estado);
      renderCursos(cursosFiltrados.map((d, i) => adaptarCurso(d, i)));
    }

    function renderCursos(cursos) {
      const grid = document.getElementById('cursos-grid');
      grid.innerHTML = '';

      if (cursos.length === 0) {
        grid.innerHTML = '<p class="col-span-3 text-center text-slate-400 font-semibold py-16">No hay cursos en esta categoría.</p>';
        return;
      }

      cursos.forEach((c) => {
        const esCerrado = c.estado === 'CERRADO';
        const estadoBadgeClases = esCerrado
          ? 'text-slate-400'
          : 'text-emerald-600';
        const estadoIcono = esCerrado
          ? `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m0 0v2m0-2h2m-2 0H10m2-10a4 4 0 00-4 4v1H6a2 2 0 00-2 2v7a2 2 0 002 2h12a2 2 0 002-2v-7a2 2 0 00-2-2h-2v-1a4 4 0 00-4-4z"/></svg>`
          : `<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v1h8v-1zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 16v-1a4 4 0 00-2.4-3.66A6 6 0 0118 16h-2z" /></svg>`;

        const card = document.createElement('div');
        card.className = `flex flex-col rounded-2xl shadow-sm hover:shadow-xl transition-shadow duration-300 overflow-hidden bg-white border border-slate-100 ${esCerrado ? 'opacity-70' : ''}`;

        card.innerHTML = `
          <!-- Cabecera de Color de la Tarjeta -->
          <div class="${c.color} p-6 pb-8 text-white flex flex-col justify-between min-h-[200px]">
            <div>
              <div class="flex items-center justify-between mb-4">
                <div class="inline-block bg-white text-slate-900 font-bold badge-pill px-2.5 py-1 rounded shadow-sm uppercase">
                  CURSO ${c.id} &bull; ${c.anio}
                </div>
                ${esCerrado ? '<span class="text-xs font-bold bg-white/20 px-2 py-1 rounded uppercase tracking-wider">Cerrado</span>' : ''}
              </div>
              <h2 class="text-2xl font-black tracking-tight leading-tight uppercase mb-1">
                ${c.titulo}
              </h2>
              ${c.subtitulo ? `<p class="text-xs tracking-wider text-slate-200 font-semibold uppercase mt-1">${c.subtitulo}</p>` : ''}
            </div>
            <div class="mt-4">
              <span class="inline-block bg-white/90 text-slate-800 font-bold badge-pill px-3 py-1 rounded">
                ${c.duracion}
              </span>
            </div>
          </div>

          <!-- Cuerpo Inferior -->
          <div class="p-6 flex-1 flex flex-col justify-between bg-white">
            <!-- Barra de Estado y Horas -->
            <div class="flex items-center gap-6 text-[0.72rem] font-bold text-slate-500 uppercase mb-4 tracking-wider">
              <div class="flex items-center gap-1.5 ${estadoBadgeClases}">
                ${estadoIcono}
                <span>${c.estado}</span>
              </div>
              <div class="flex items-center gap-1.5 text-rose-700">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>${c.duracion}</span>
              </div>
            </div>

            <!-- Descripción completa -->
            <h3 class="text-sm font-extrabold text-[#232f48] tracking-tight leading-snug uppercase mb-4">
              ${c.descripcion || c.titulo}
            </h3>

            <!-- Botón de inscripción -->
            ${!esCerrado && c.enlace ? `
            <a href="${c.enlace}" target="_blank" rel="noopener noreferrer"
              class="mt-auto block text-center bg-[#93151b] hover:bg-[#781015] text-white font-bold text-xs uppercase tracking-widest py-2.5 px-4 rounded-lg transition-colors">
              Inscribirme
            </a>` : `
            <span class="mt-auto block text-center bg-slate-100 text-slate-400 font-bold text-xs uppercase tracking-widest py-2.5 px-4 rounded-lg cursor-not-allowed">
              Inscripciones cerradas
            </span>`}
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // Renderizado inicial con todos los cursos
    renderCursos(CURSOS_RAW.map((d, i) => adaptarCurso(d, i)));
  </script>
</body>
</html>
